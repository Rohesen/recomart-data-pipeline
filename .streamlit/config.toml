[theme]
base = "dark"
primaryColor = "#A78BFA"
backgroundColor = "#1C0E40"
secondaryBackgroundColor = "#2A1858"
textColor = "#EEE9FF"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 1

[client]
showErrorDetails = "type"
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
