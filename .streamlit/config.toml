[theme]
base = "dark"
primaryColor = "#38BDF8"
backgroundColor = "#050A14"
secondaryBackgroundColor = "#0B1526"
textColor = "#E6F3FF"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 1

[client]
showErrorDetails = "type"
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
