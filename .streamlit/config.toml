[theme]
base = "dark"
primaryColor = "#93C5FD"
backgroundColor = "#0A0D16"
secondaryBackgroundColor = "#141826"
textColor = "#E5E7EB"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 1

[client]
showErrorDetails = "type"
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
